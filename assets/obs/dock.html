<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CasterDesk · OBS</title>
<style>
:root{color-scheme:dark;font:14px 'Segoe UI',Arial,sans-serif;background:#0a1118;color:#eef4f8}*{box-sizing:border-box}body{margin:0;padding:12px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}header img{width:180px;height:auto}#connection{font-size:12px;color:#9bb0c2}nav{display:flex;gap:4px;margin:12px 0}button,input{font:inherit;color:inherit;border:1px solid #526579;background:#1b2d3e;border-radius:3px;padding:8px}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #71cee5;outline-offset:2px}button:hover:enabled{border-color:#40bad4;background:#28445a}button:disabled{opacity:.38;cursor:default}nav button{flex:1}nav button[aria-selected=true]{border-bottom:3px solid #ff4335}.card{background:#203247;padding:12px;margin-bottom:10px;border-radius:4px}#context{line-height:1.5;font-weight:600}#time{font-size:42px;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px}.controls .start{background:#327fa8}.set{display:flex;gap:6px;margin-top:12px}.set input{min-width:0;flex:1}#error{color:#ffb69d;min-height:18px;margin:8px 0;font-size:12px}#ban-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:10px 0}.slot{padding:8px 4px;text-align:center;font-size:11px;border-bottom:3px solid var(--team);background:#162637;min-width:0}.slot strong{display:block;overflow:hidden;text-overflow:ellipsis}.slot.next{outline:2px solid #ffffff}#operators{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:5px}.operator{padding:4px;min-width:0;font-size:11px}.operator img{display:block;width:38px;height:38px;object-fit:contain;margin:2px auto 5px}.operator span{display:block;overflow:hidden;text-overflow:ellipsis}#search{width:100%;margin-bottom:8px}#phase{font-weight:600;margin:10px 0}small{color:#aac0d2}section[hidden]{display:none}#bans-wait{font-size:12px;color:#aac0d2;margin:8px 0}
</style></head><body>
<header><img src="/brand.svg" alt="CasterDesk"><span id="connection" role="status">Conectando…</span></header>
<nav role="tablist"><button id="tab-timer" role="tab" aria-selected="true">Cronômetro</button><button id="tab-bans" role="tab" aria-selected="false">Bans</button></nav>
<div id="context" class="card">—</div><div id="error" role="status" aria-live="polite"></div>
<section id="timer"><div class="card"><div id="time">00:00</div><div class="controls"><button id="start" class="start">▶ Iniciar / Retomar</button><button id="pause">Ⅱ Pausar</button><button id="subtract">− 1 min</button><button id="add">+ 1 min</button></div><div class="set"><input id="duration" aria-label="Tempo inicial" placeholder="10:00" maxlength="8"><button id="set">Definir tempo</button></div></div></section>
<section id="bans" hidden><div id="ban-slots"></div><div id="phase">—</div><div id="bans-wait"></div><input id="search" aria-label="Filtrar operadores" placeholder="Selecionar…"><div id="operators"></div></section>
<script src="/dock.js"></script></body></html>
