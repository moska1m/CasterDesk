name: Build CasterDesk OBS plugin
on:
  push:
    branches: [main]
    paths: ['obs-plugin/**', '.github/workflows/obs-plugin.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: deps
        with:
          path: obs-plugin/.deps
          key: obs-native-deps-${{ runner.os }}-${{ hashFiles('obs-plugin/buildspec.json') }}
      - name: Configure native plugin with official OBS dependencies
        working-directory: obs-plugin
        run: cmake --preset windows-ci-x64
      - uses: actions/cache/save@v4
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: obs-plugin/.deps
          key: obs-native-deps-${{ runner.os }}-${{ hashFiles('obs-plugin/buildspec.json') }}
      - name: Build plugin and offscreen checks
        working-directory: obs-plugin
        run: cmake --build --preset windows-x64 --config RelWithDebInfo --parallel
      - name: Test native controls without OBS or desktop windows
        working-directory: obs-plugin
        shell: pwsh
        run: |
          $qt = Get-ChildItem .deps -Recurse -Filter Qt6Core.dll | Select-Object -First 1
          if (!$qt) { throw 'Qt runtime missing' }
          $depBin = Get-ChildItem .deps -Directory | ForEach-Object { Join-Path $_.FullName 'bin' }
          $env:PATH = $qt.DirectoryName + ';' + ($depBin -join ';') + ';' + $env:PATH
          $env:QT_PLUGIN_PATH = Join-Path $qt.Directory.Parent.FullName 'plugins'
          $env:QT_QPA_PLATFORM = 'minimal'
          Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public static class HeadlessMode { [DllImport("kernel32.dll")] public static extern uint SetErrorMode(uint mode); }'
          [HeadlessMode]::SetErrorMode(3) | Out-Null
          $test = Start-Process ./build_x64/RelWithDebInfo/casterdesk-panel-checks.exe -WindowStyle Hidden -PassThru -RedirectStandardOutput panel-test.out -RedirectStandardError panel-test.err
          if (!$test.WaitForExit(45000)) { Stop-Process -Id $test.Id -Force; Get-Content panel-test.out,panel-test.err; throw 'Native checks timed out' }
          Get-Content panel-test.out,panel-test.err
          if ($test.ExitCode -ne 0) { throw "Native panel checks failed: $($test.ExitCode)" }
      - name: Stage plugin
        working-directory: obs-plugin
        run: cmake --install build_x64 --prefix release --config RelWithDebInfo
      - uses: actions/upload-artifact@v4
        with:
          name: casterdesk-obs-windows-x64
          path: obs-plugin/release/casterdesk-obs/**
          if-no-files-found: error
